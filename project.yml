name: CalHacks
options:
  bundleIdPrefix: com.tobiasvonkoch
  deploymentTarget:
    iOS: "26.0"
packages:
  MWDAT:
    url: https://github.com/facebook/meta-wearables-dat-ios
    from: 1.0.1
settings:
  base:
    DEVELOPMENT_TEAM: VBT92TS7FT
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    PRODUCT_BUNDLE_IDENTIFIER: com.tobiasvonkoch.calhacks13
targets:
  CalHacks:
    type: application
    platform: iOS
    # The conversation engine and recognizer are shared with the Mac tool in Assist/.
    sources: [App, Assist/Sources/AssistCore, Assist/Sources/AssistSpeech]
    # cp Secrets.example.xcconfig Secrets.xcconfig and put your answer-model key in it.
    configFiles:
      Debug: Secrets.xcconfig
      Release: Secrets.xcconfig
    dependencies:
      - package: MWDAT
        product: MWDATCore
      - package: MWDAT
        product: MWDATCamera
      - package: MWDAT
        product: MWDATDisplay
      - package: MWDAT
        product: MWDATInputs
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: CalHacks
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: Recognizes your teammates' faces on device.
        NSMicrophoneUsageDescription: Listens for questions so answers can appear on your glasses.
        NSSpeechRecognitionUsageDescription: Transcribes speech on device to spot questions as they are asked.
        AnswerAPIKey: $(ANSWER_API_KEY)
        AnswerProvider: $(ANSWER_PROVIDER)
        NSBluetoothAlwaysUsageDescription: Connects to your Meta glasses.
        NSLocalNetworkUsageDescription: Lets your phone find and connect to your glasses over Wi-Fi.
        NSBonjourServices: [_bonjour._tcp]
        UIBackgroundModes: [audio, processing, bluetooth-central, bluetooth-peripheral, external-accessory]
        UISupportedExternalAccessoryProtocols: [com.meta.ar.wearable]
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes: [calhacks13]
        MWDAT:
          AppLinkURLScheme: "calhacks13://"
          MetaAppID: "0"
          ClientToken: ""
          TeamID: $(DEVELOPMENT_TEAM)
