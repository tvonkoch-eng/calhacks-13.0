name: CalHacks
options:
  bundleIdPrefix: com.tobiasvonkoch
  deploymentTarget:
    iOS: "17.2"
packages:
  MWDAT:
    url: https://github.com/facebook/meta-wearables-dat-ios
    from: 1.0.1
settings:
  base:
    DEVELOPMENT_TEAM: VBT92TS7FT
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    PRODUCT_BUNDLE_IDENTIFIER: com.tobiasvonkoch.calhacks13
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    # The face model is loaded by file name, not through a generated class, so the app still
    # compiles when App/*.mlmodel is absent (it falls back to the Vision feature print).
    COREML_CODEGEN_LANGUAGE: None
targets:
  CalHacks:
    type: application
    platform: iOS
    sources: [App]
    # cp Secrets.example.xcconfig Secrets.xcconfig and put your answer-model key in it.
    configFiles:
      Debug: Secrets.xcconfig
      Release: Secrets.xcconfig
    dependencies:
      - package: MWDAT
        product: MWDATCore
      - package: MWDAT
        product: MWDATCamera
      - package: MWDAT
        product: MWDATDisplay
      - package: MWDAT
        product: MWDATInputs
      - package: MWDAT
        product: MWDATSpeech
      - package: MWDAT
        product: MWDATMockDevice
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: CalHacks
        UILaunchScreen: {}
        # Recorded stream frames (Documents/frames) show up in the Files app.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: Recognizes your teammates' faces on device.
        NSMicrophoneUsageDescription: Listens for questions so answers can appear on your glasses. Audio is transcribed by Meta's Muse Voice Transcribe.
        # Conversation aid lanes (App/Aid.swift, Aid.Config.fromBundle); filled from Secrets.xcconfig.
        MuseAPIKey: $(MUSE_API_KEY)
        AnswerProvider: $(ANSWER_PROVIDER)
        AnswerAPIKey: $(ANSWER_API_KEY)
        AnswerModel: $(ANSWER_MODEL)
        AnswerPerMinute: $(ANSWER_PER_MINUTE)
        CoachProvider: $(COACH_PROVIDER)
        CoachAPIKey: $(COACH_API_KEY)
        CoachModel: $(COACH_MODEL)
        SuggestProvider: $(SUGGEST_PROVIDER)
        SuggestAPIKey: $(SUGGEST_API_KEY)
        SuggestModel: $(SUGGEST_MODEL)
        BackupProvider: $(BACKUP_PROVIDER)
        BackupAPIKey: $(BACKUP_API_KEY)
        BackupModel: $(BACKUP_MODEL)
        ResearchProvider: $(RESEARCH_PROVIDER)
        CartesiaAPIKey: $(CARTESIA_API_KEY)
        CartesiaVoice: $(CARTESIA_VOICE)
        ResearchAPIKey: $(RESEARCH_API_KEY)
        ResearchModel: $(RESEARCH_MODEL)
        OpenAIAPIKey: $(OPENAI_API_KEY)
        WearerBackground: $(WEARER_BACKGROUND)
        Situation: $(SITUATION)
        WearerName: $(WEARER_NAME)
        Tools: $(TOOLS)
        TestLocation: $(TEST_LOCATION)
        NSLocationWhenInUseUsageDescription: Finds places near you when you ask.
        NSRemindersFullAccessUsageDescription: Sets reminders when you ask.
        NSCalendarsFullAccessUsageDescription: Tells you what is next on your calendar.
        NSContactsUsageDescription: Saves people you met to your Contacts when you ask.
        NSBluetoothAlwaysUsageDescription: Connects to your Meta glasses.
        NSLocalNetworkUsageDescription: Lets your phone find and connect to your glasses over Wi-Fi.
        NSBonjourServices: [_bonjour._tcp]
        UIBackgroundModes: [audio, processing, bluetooth-central, bluetooth-peripheral, external-accessory]
        UISupportedExternalAccessoryProtocols: [com.meta.ar.wearable]
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes: [calhacks13]
        MWDAT:
          AppLinkURLScheme: "calhacks13://"
          MetaAppID: "0"
          ClientToken: ""
          TeamID: $(DEVELOPMENT_TEAM)
